<!DOCTYPE html>
<html lang="en"><head><title>Log in • ConnectHub</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page" data-page="login">
<div class="card auth-card">
  <h1><i class="fa-solid fa-bolt" style="color:var(--primary)"></i> ConnectHub</h1>
  <p class="sub">Welcome back! Log in to continue.</p>
  <div id="formMessage" class="form-msg hidden"></div>
  <form id="loginForm" novalidate>
    <div class="field"><label for="email">Email or username</label><input id="email" type="text" autocomplete="username" placeholder="you@example.com"></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password"></div>
    <button class="btn btn-primary btn-block" id="submitBtn" type="submit">Log in</button>
  </form>
  <p class="switch">New here? <a href="register.html">Create an account</a></p>
</div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
</body></html>
