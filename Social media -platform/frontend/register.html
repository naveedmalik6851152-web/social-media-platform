<!DOCTYPE html>
<html lang="en"><head><title>Sign up • ConnectHub</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page" data-page="register">
<div class="card auth-card">
  <h1><i class="fa-solid fa-bolt" style="color:var(--primary)"></i> Join ConnectHub</h1>
  <p class="sub">Create your account in seconds.</p>
  <div id="formMessage" class="form-msg hidden"></div>
  <form id="registerForm" novalidate>
    <div class="avatar-picker">
      <img class="avatar xl" id="picPreview" alt="Profile preview" style="width:72px;height:72px">
      <label class="btn btn-outline btn-sm"><i class="fa-regular fa-image"></i> Profile picture (optional)<input type="file" id="profilePicture" accept="image/*" hidden></label>
    </div>
    <div class="field"><label for="name">Full name</label><input id="name" type="text" autocomplete="name" placeholder="Jane Doe"></div>
    <div class="field"><label for="username">Username</label><input id="username" type="text" autocomplete="username" placeholder="jane_doe"></div>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="jane@example.com"></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" placeholder="Min 8 chars, letters + numbers"></div>
    <button class="btn btn-primary btn-block" id="submitBtn" type="submit">Create account</button>
  </form>
  <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
</div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
</body></html>
