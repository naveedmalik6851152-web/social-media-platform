<!DOCTYPE html>
<html lang="en"><head><title>Home • ConnectHub</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css"></head>
<body data-page="home">
<div id="navbar"></div>
<main class="container layout">
  <section class="feed-col">
    <div class="card composer">
      <img class="avatar" id="composerAvatar" alt="You">
      <button class="composer-input" id="composerBtn">What's on your mind?</button>
      <button class="btn btn-primary btn-sm" id="composerPost"><i class="fa-solid fa-plus"></i> Post</button>
    </div>
    <div class="tabs">
      <button class="tab active" data-feed="all">Explore</button>
      <button class="tab" data-feed="following">Following</button>
    </div>
    <div id="posts"></div>
    <div id="loadMore" class="center"></div>
  </section>
  <aside class="side-col"><div class="card"><h3>Who to follow</h3><div id="suggestions"></div></div></aside>
</main>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script src="js/feed.js"></script>
</body></html>
